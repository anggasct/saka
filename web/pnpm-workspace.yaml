packages:
  - "."
# Install policy, checked by `cargo xtask supply-chain`. An explicit minimumReleaseAge is strict:
# a release younger than 24 hours fails the install instead of joining the exclude list.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# semver 6.3.1 is a backport release published by maintainers after 7.x, which pnpm flags as a trust downgrade.
trustPolicyExclude:
  - semver@6.3.1
minimumReleaseAgeExclude:
  - "@formatjs/ts-transformer@4.5.2"
  - eslint-plugin-formatjs@8.1.3
# `typescript` is the TypeScript 6 API package that ESLint and openapi-typescript load;
# `tsc` comes from TypeScript 7 (`typescript-native`).
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
    eslint-plugin-jsx-a11y>eslint: "10"
# GHSA-g3hv-75wg-m249: eslint and typescript-estree still depend on minimatch 10 (vulnerable below 11.0.1).
overrides:
  minimatch@10: 11.0.1
