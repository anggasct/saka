name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: desktop-linux
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            artifact: desktop-macos
            files: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      NO_STRIP: "true"
      SAKA_UPDATER_PUBKEY: ${{ vars.SAKA_UPDATER_PUBKEY }}
      SAKA_UPDATER_ENDPOINT: ${{ vars.SAKA_UPDATER_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: target/tools
          key: desktop-tools-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
        working-directory: web
      - run: cargo xtask desktop-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
