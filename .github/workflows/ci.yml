name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # pnpm comes from web/package.json (`packageManager`) through corepack; pnpm
      # downloads the Node version `devEngines` pins.
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
        working-directory: web
      - run: corepack pnpm e2e:install --with-deps
        working-directory: web
      - run: make check
