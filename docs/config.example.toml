# Saka operator config: $XDG_CONFIG_HOME/saka/config.toml, or the file named by SAKA_CONFIG.
# Every field is optional except an [[scm]] entry's id, provider, app_id, and private_key_file.
# Unknown fields are an error (config_unknown_field).

[server]
listen = "127.0.0.1:7420"          # loopback only; any other address exits with code 2
allowed_origins = []               # extra browser origins, e.g. "http://localhost:5173" for the Vite dev server
data_dir = "~/.local/share/saka"   # default $XDG_DATA_HOME/saka; no * ? [ ] { } ( ) ! + @ | \ in the path

[scheduler]
max_active_tasks = 2               # 1..=16

[[scm]]
id = "github"                      # ^[a-z0-9-]{1,32}$, unique
provider = "github"
api_url = "https://api.github.com"
web_url = "https://github.com"
app_id = 123456
private_key_file = "~/.config/saka/github-app.pem"   # mode 0600, owned by you (else config_key_file_mode)
poll_interval_secs = 15            # 5..=300
ci_appear_timeout_secs = 600       # 60..=3600
merge_method = "squash"            # merge | squash | rebase

[agent]
cli = "claude"
command = "claude"                 # looked up in agent.path
account_dir = "~/.local/share/saka/agents/claude/default"   # CLAUDE_CONFIG_DIR; log in once by hand
model = ""                         # empty = the CLI default
path = ["~/.local/bin", "/usr/local/go/bin", "/usr/local/bin", "/usr/bin", "/bin"]
max_followup_turns = 1
permission_wait_hours = 24         # 1..=168; a permission request pending longer blocks the task
idle_minutes = 30                  # 1..=1440; an interrupted session idle longer blocks the task
rate_limit_pause = 0.9             # 0.5..=1.0; new tasks wait while an account window is this full
limits = { memory_max = "4G", cpu_quota = "200%", tasks_max = 512 }

[budget]
warn_percent = 80                  # 50..=99

[budget.dev]
running_minutes = 60               # 1..=1440; running time of all sessions of a stage run, without waiting or idle time
turns = 10                         # 1..=100; turns sent to the CLI in a stage run
tokens = 0                         # 0 = no limit; input + output
cost_usd = 0.0                     # 0 = no limit; cost reported by the CLI

[env]
port_range = "41000-48999"         # inclusive, 1024..=65535; must hold ports_per_env x scheduler.max_active_tasks ports
ports_per_env = 10                 # 1..=100; block size per environment; a recipe may ask for fewer
setup_timeout_minutes = 15         # 1..=240; per setup or teardown command
limits = { memory_max = "4G", cpu_quota = "200%", tasks_max = 512 }   # cgroup of each recipe command

[toolchain]                        # Go, Node, and pnpm versions a repo declares are installed from these
go_dl_url = "https://go.dev/dl"    # https, or http on a loopback host (a local mirror)
node_dist_url = "https://nodejs.org/dist"
npm_registry_url = "https://registry.npmjs.org"
download_timeout_secs = 600        # 30..=3600; per download

[git]
author_name = "Saka Agent"
author_email = "agent@saka.invalid"

# Permission rules for agent sessions. Built-in rules come first and cannot be turned off:
# file tools outside the worktree and any Bash command containing `git push` are denied.
# Precedence: deny > ask > allow; no matching rule means ask. A `commands` glob matches the
# whole command and never matches one containing ; & | ` $( > < or a newline.

[[permission.rule]]
id = "read-tools"                  # ^[a-z0-9-]{1,64}$, unique
effect = "allow"                   # allow | deny | ask
tools = ["Read", "Glob", "Grep", "LS", "TodoWrite"]

[[permission.rule]]
id = "edit-in-worktree"
effect = "allow"
tools = ["Write", "Edit", "MultiEdit", "NotebookEdit"]
paths = ["**"]                     # globs relative to the worktree

[[permission.rule]]
id = "safe-commands"
effect = "allow"
tools = ["Bash"]
commands = ["go test *", "go vet *", "go build *", "gofmt *", "npm test*", "npm run *", "git status*", "git diff*", "git add *", "git commit *", "git log*", "ls *", "cat *"]
