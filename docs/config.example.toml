# Saka operator config: $XDG_CONFIG_HOME/saka/config.toml, or the file named by SAKA_CONFIG.
# Every field is optional except an [[scm]] entry's id and provider, and its credential:
# app_id and private_key_file for github, token_file for gitlab.
# Unknown fields are an error (config_unknown_field).

[server]
listen = "127.0.0.1:7420"          # loopback unless [auth] is set; any other address then exits with code 2 (config_listen_not_loopback)
allowed_origins = []               # extra browser origins, e.g. "http://localhost:5173" for the Vite dev server, or "tauri://localhost" for the desktop app
data_dir = "~/.local/share/saka"   # default $XDG_DATA_HOME/saka; no * ? [ ] { } ( ) ! + @ | \ in the path

# Remove this section to run on loopback without credentials. With it, every request needs a passkey session or a
# device token, loopback included, and `listen` may be a non-loopback address. Saka does not terminate TLS:
# put a reverse proxy, a tunnel, or a VPN in front and use its https address as origin.
[auth]
origin = "https://saka.example.com"  # https://<domain>[:port]; http://localhost:<port> only for development on a loopback listen
rp_id = "example.com"                # the domain of origin or a parent of it; passkeys are bound to it
rp_name = "Saka"                     # shown by the browser when a passkey is created, 1..=100 characters
session_hours = 168                  # 1..=720; a browser session ends this long after sign-in, with no renewal

[scheduler]
max_active_tasks = 2               # 1..=16

[workflow]
allow_unreviewed_chore = false     # true lets a project's saka.toml skip review for the chore kind

[workspace]
config_poll_secs = 300             # 0 or 30..=86400; how often each project's saka.toml is re-read (0 = only on reload)

# [hooks]                          # optional: a listener that only serves POST /hooks/{scm.id}
# listen = "127.0.0.1:7421"        # must differ from server.listen; put TLS and a public URL in front of it

# `saka scm create-app` appends this block with the files it writes in scm/<id>/ next to this config.
[[scm]]
id = "github"                      # ^[a-z0-9-]{1,32}$, unique
provider = "github"
api_url = "https://api.github.com" # https, or http on a loopback host (localhost, 127.0.0.0/8, [::1])
web_url = "https://github.com"     # same rule; for GitHub Enterprise Server api_url is <web_url>/api/v3
app_id = 123456
private_key_file = "~/.config/saka/scm/github/private-key.pem"   # mode 0600, owned by you (else config_key_file_mode)
poll_interval_secs = 15            # 5..=300
ci_appear_timeout_secs = 600       # 60..=3600
merge_method = "squash"            # merge | squash | rebase
# webhook_secret_file = "~/.config/saka/scm/github/webhook-secret"   # the GitHub App webhook secret; 0600, 32..=1024 bytes
client_id = "Iv23liAbCdEfGh123456"  # the GitHub App Client ID (not app_id), 1..=64 of [A-Za-z0-9._-]; needed by `saka scm link`

# GitLab (gitlab.com or self-managed): one project or group access token with the api and write_repository scopes,
# role Developer or higher, in a 0600 file. The file is read on every request, so replacing it rotates the token.
# Delete the entry you do not use.
[[scm]]
id = "gitlab"                      # ^[a-z0-9-]{1,32}$, unique
provider = "gitlab"
web_url = "https://git.example.com" # default https://gitlab.com; https, or http on a loopback host
# api_url = "https://git.example.com/api/v4"   # default <web_url>/api/v4
token_file = "~/.config/saka/scm/gitlab/token"   # mode 0600, owned by you (else config_key_file_mode)
poll_interval_secs = 15            # 5..=300
ci_appear_timeout_secs = 600       # 60..=3600
merge_method = "merge"             # merge | squash; rebase is refused (config_merge_method_unsupported)
# webhook_secret_file = "~/.config/saka/scm/gitlab/webhook-secret"   # the webhook Secret token; 0600, 32..=1024 bytes
# client_id is not supported for gitlab (config_user_authorship_unsupported)

[agent]
cli = "claude"
command = "claude"                 # looked up in agent.path
account_dir = "~/.local/share/saka/agents/claude/default"   # CLAUDE_CONFIG_DIR; log in with `saka agent login`
model = ""                         # empty = the CLI default
path = ["~/.local/bin", "/usr/local/go/bin", "/usr/local/bin", "/usr/bin", "/bin"]
max_followup_turns = 1
permission_wait_hours = 24         # 1..=168; a permission request pending longer blocks the task
decision_wait_hours = 72           # 1..=168; a question to the operator pending longer blocks the task
idle_minutes = 30                  # 1..=1440; an interrupted session idle longer blocks the task
rate_limit_pause = 0.9             # 0.5..=1.0; new tasks wait while an account window is this full
limits = { memory_max = "4G", cpu_quota = "200%", tasks_max = 512 }

[budget]
warn_percent = 80                  # 50..=99

[budget.dev]
running_minutes = 60               # 1..=1440; running time of all sessions of a stage run, without waiting or idle time
turns = 10                         # 1..=100; turns sent to the CLI in a stage run
tokens = 0                         # 0 = no limit; input + output
cost_usd = 0.0                     # 0 = no limit; cost reported by the CLI

[budget.architect]
running_minutes = 30               # 1..=1440; running time of all sessions of one draft attempt
turns = 6                          # 1..=100, and at least architect.lint_rounds
tokens = 0                         # 0 = no limit; input + output
cost_usd = 0.0                     # 0 = no limit; cost reported by the CLI

[budget.review]
running_minutes = 20               # 1..=1440; running time of one review run
turns = 3                          # 1..=100; the packet, one format correction, and one spare
tokens = 0                         # 0 = no limit; input + output
cost_usd = 0.0                     # 0 = no limit; cost reported by the CLI

[budget.fix]
running_minutes = 30               # 1..=1440; running time of one fix round
turns = 6                          # 1..=100; turns sent to the CLI in a fix round
tokens = 0                         # 0 = no limit; input + output
cost_usd = 0.0                     # 0 = no limit; cost reported by the CLI

[architect]
max_active = 1                     # 1..=4; drafts preparing, drafting, or committing at once
lint_rounds = 4                    # 1..=10; lint checks per attempt (the first after the first turn)
session_idle_hours = 72            # 1..=168; a session-mode draft waiting for the operator this long fails
model = ""                         # empty = agent.model

[env]
port_range = "41000-48999"         # inclusive, 1024..=65535; must hold ports_per_env x scheduler.max_active_tasks ports
ports_per_env = 10                 # 1..=100; block size per environment; a recipe may ask for fewer
setup_timeout_minutes = 15         # 1..=240; per setup or teardown command
limits = { memory_max = "4G", cpu_quota = "200%", tasks_max = 512 }   # cgroup of each recipe command

[toolchain]                        # Go, Node, and pnpm versions a repo declares are installed from these
go_dl_url = "https://go.dev/dl"    # https, or http on a loopback host (a local mirror)
node_dist_url = "https://nodejs.org/dist"
npm_registry_url = "https://registry.npmjs.org"
download_timeout_secs = 600        # 30..=3600; per download

# Project secrets (`saka secret set`) are sealed with XChaCha20-Poly1305 under a 32-byte key in
# `secret.key` next to this file. It is created 0600 on first start; any other mode refuses start.

[git]
name = "Saka Agent"                # Saka's identity: committer of every agent commit, author in bot mode; no < > or newline
email = "agent@saka.invalid"       # 3..=254 bytes with exactly one @

# Permission rules for agent sessions. Built-in rules come first and cannot be turned off:
# file tools outside the worktree and any Bash command containing `git push` are denied.
# Precedence: deny > ask > allow; no matching rule means ask. A Bash command joined with && || ; | or
# a newline is judged part by part, and a `commands` glob matches one part, never across parts.
# The command is allowed only when every part is allowed by a rule, and one deny or ask decides it all.
# A command Saka cannot split safely (substitution, backticks, redirects, a lone &, an assignment
# prefix, eval/sh/sudo and the like) is never allowed by a glob: it asks, or is denied by a deny rule.

[[permission.rule]]
id = "read-tools"                  # ^[a-z0-9-]{1,64}$, unique
effect = "allow"                   # allow | deny | ask
tools = ["Read", "Glob", "Grep", "LS", "TodoWrite"]

[[permission.rule]]
id = "edit-in-worktree"
effect = "allow"
tools = ["Write", "Edit", "MultiEdit", "NotebookEdit"]
paths = ["**"]                     # globs relative to the worktree

[[permission.rule]]
id = "safe-commands"
effect = "allow"
tools = ["Bash"]
commands = ["go test *", "go vet *", "go build *", "gofmt *", "npm test*", "npm run *", "git status*", "git diff*", "git add *", "git commit *", "git log*", "ls *", "cat *"]

# How far the loop may run on its own, per repo. This is the ceiling: a repo's saka.toml can ask for
# a lower level (`autonomy` under [project] or [[repo]]) and never a higher one. Changing it needs a restart.
#   strict      each step waits for you to start it; merging is one tap
#   standard    steps start by themselves once the spec is approved; merging is one tap (default)
#   autonomous  steps start by themselves; Saka merges when the review approved the head and CI is green on it
[autonomy]
default = "standard"               # strict | standard | autonomous

[[autonomy.repo]]
repo = "acme/api"                  # owner/name as the host shows it, case-insensitive; each repo once
level = "autonomous"

# Chat notifications. A `notify` hook sends its message through one of these channels; the hook
# decides which events, projects and filters (see the hooks below). Saka never creates a bot or an
# account: you make the bot, put its token in a file, and name your chat.
[notify]
public_url = "https://saka.example.com"   # optional; links to the task are added only when set. https (http on a loopback host), no credentials, query or fragment
language = "en"                    # en | id

[[notify.channel]]
name = "ops"                       # ^[a-z0-9-]{1,32}$, unique; at most 8 channels
kind = "telegram"                  # telegram | discord
token_file = "~/.config/saka/notify/ops.token"   # the bot token; mode 0600, owned by you (else config_key_file_mode)
chat = "-1001234567890"            # telegram: the chat id (an integer, negative for groups); discord: the channel id (digits)
# api_url = "https://api.telegram.org"   # optional; default per kind (discord: https://discord.com/api/v10)
actions = true                     # put a Retry or Cancel button on a blocked-task message and listen for the press
allowed_users = ["123456789"]      # required with actions: the chat user ids (digits, at most 8) allowed to press; nobody else can act
                                   # Saka long-polls Telegram (or holds a Discord Gateway connection) from this host: no inbound port is opened

# Hooks run something when an event happens in a project's loop (the [hooks] table above is the
# inbound webhook listener; these are outbound). Hooks live only here, never in saka.toml or the repo.
# `on` is change_opened | review_done | merged | task_done | spec_shipped | blocked | inbox_item_opened. A run is recorded for every
# match and kept as history; a failed run can be re-run from the API, the CLI, or Settings.

[[hook]]
name = "announce-merge"            # ^[a-z0-9-]{1,32}$, unique per project
project = "tasks"                  # a project name, or its id
on = "merged"
action = "webhook"                 # run | run_host | webhook | notify
url = "https://ci.example.com/saka"   # https, or http on a loopback host; no credentials in the URL
secret = "HOOK_SIGNING_KEY"        # a project secret (`saka secret set`) that signs the body with HMAC-SHA256
repos = ["app"]                    # optional: repo binding names; empty = all
branches = ["main", "release/*"]   # optional: base branch of the change; globs
timeout_secs = 10                  # 1..=30

[[hook]]
name = "tell-ops"
project = "tasks"
on = "blocked"
action = "notify"
channel = "ops"                    # a [[notify.channel]] name; start is refused if there is none
codes = ["ci_red", "dod_failed"]   # optional, only with on = "blocked"

# inbox_item_opened fires when something starts waiting for you (a permission, an approval, a blocker). It has no repo, so it takes
# no `repos` or `branches` filter and cannot use `run`. The message carries the kind and subject and a link to /inbox/<id> when
# [notify] public_url is set.

# `run` executes the command in a throwaway environment checked out at the commit of the event
# (spec_shipped: the tip of the named repo's base branch, so it needs exactly one `repos` entry),
# with the project's toolchain, a cgroup, and a timeout. Only the secrets listed here are passed.
# The recipe's setup commands are not run: put what the command needs in the command itself.

[[hook]]
name = "deploy-staging"
project = "tasks"
on = "merged"
action = "run"
command = "./scripts/deploy.sh staging"   # sh -c; SAKA_EVENT, SAKA_PROJECT, SAKA_REPO, SAKA_SHA, SAKA_PR, SAKA_TASK_KEY, SAKA_SPEC, SAKA_BRANCH, SAKA_HOOK, SAKA_HOOK_RUN
secrets = ["DEPLOY_TOKEN"]         # project secrets passed to the command
timeout_secs = 600                 # 1..=3600, default 300

# `run_host` runs on this machine, outside any sandbox, as the user running Saka. It is allowed only
# here: saka.toml and .saka/ cannot define it, and `saka serve` refuses to start if this file is
# writable by anyone else. The command gets only PATH, HOME, LANG and the SAKA_* variables above,
# never a project secret, and runs in its own cgroup with a timeout.

[[hook]]
name = "refresh-dashboard"
project = "tasks"
on = "task_done"
action = "run_host"
command = "/usr/local/bin/refresh-dashboard"
cwd = "~/dashboards"               # optional; default is a private scratch directory

# A `gate` hook (only with on = "merged") holds the task in the sync stage: it is done only after
# every gate hook of its merge succeeded. A failed gate blocks the task with hook_failed, and retrying
# the task runs the failed gates again. `after` (the default) never holds the task.

[[hook]]
name = "staging-smoke-test"
project = "tasks"
on = "merged"
mode = "gate"
action = "run"
command = "./scripts/smoke.sh staging"
repos = ["app"]
branches = ["main"]
