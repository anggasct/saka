[package]
name = "saka-engine"
description = "Shell around the core: loads state, calls the core, and writes events, projections, and jobs; runs workers and the reconciler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
saka-core = { path = "../saka-core" }
saka-ports = { path = "../saka-ports" }
saka-spec = { path = "../saka-spec" }
saka-store = { path = "../saka-store" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures-util.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
saka-testkit = { path = "../saka-testkit" }
tracing-subscriber.workspace = true
