[package]
name = "saka-api"
description = "Control API over HTTP: JSON endpoints, server-sent events, OpenAPI, and ops endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
rust-embed = { workspace = true, optional = true }
saka-core = { path = "../saka-core" }
saka-engine = { path = "../saka-engine" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
# Builds `web/dist` into the binary (run `pnpm --dir web build` first).
embed-web = ["dep:rust-embed", "rust-embed/debug-embed"]

[dev-dependencies]
saka-testkit = { path = "../saka-testkit" }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v7"] }
http-body-util = "0.1.5"
