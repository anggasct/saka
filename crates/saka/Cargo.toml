[package]
name = "saka"
description = "Saka: a self-hosted delivery loop for coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
jiff.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["process"] }
saka-agents = { path = "../saka-agents" }
saka-api = { path = "../saka-api" }
saka-core = { path = "../saka-core" }
saka-docs = { path = "../saka-docs" }
saka-engine = { path = "../saka-engine" }
saka-env = { path = "../saka-env" }
saka-ports = { path = "../saka-ports" }
saka-scm = { path = "../saka-scm" }
saka-store = { path = "../saka-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
# Serves the web app from the binary (run `pnpm --dir web build` first).
embed-web = ["saka-api/embed-web"]

[dev-dependencies]
rusqlite.workspace = true
saka-spec = { path = "../saka-spec" }
saka-testkit = { path = "../saka-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "runner"
harness = false
