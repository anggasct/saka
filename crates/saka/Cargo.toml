[package]
name = "saka"
description = "Saka: a self-hosted delivery loop for coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
saka-agents = { path = "../saka-agents" }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
saka-core = { path = "../saka-core" }
saka-env = { path = "../saka-env" }
saka-ports = { path = "../saka-ports" }
saka-testkit = { path = "../saka-testkit" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v7"] }

[[test]]
name = "runner"
harness = false
