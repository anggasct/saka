[workspace]
resolver = "3"
members = ["crates/*", "xtask", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing"] }
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.59.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.21"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
proptest = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-stream = { version = "0.1.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["macros", "uuid"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
uuid = { version = "1.29.0", features = ["serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
