[workspace]
resolver = "3"
members = ["crates/*", "xtask", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing"] }
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.59.0", default-features = false }
flate2 = "1.1.10"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.21"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
proptest = "1.12.0"
ra-ap-rustc_lexer = "0.181.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.18"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-stream = { version = "0.1.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["macros", "uuid"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
uuid = { version = "1.29.0", features = ["serde"] }
wasm-bindgen = "0.2.130"
wiremock = "0.6.5"
zeroize = "1.9.1"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Line tables keep file:line in backtraces; full debuginfo made every test
# binary slow to link and filled the disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser build of saka-wasm: small, since the web app downloads it.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
